name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: unit tests
        run: node unit-test.mjs

      - name: rules & queue tests
        run: node runtime/tools/test-rules.mjs

  # 包自洽：client id / package name / bundle id 三者一致、必要文件齐、无机器痕迹
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: package consistency
        run: node tools/check-package.mjs
